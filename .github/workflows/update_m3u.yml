name: Auto Update M3U (Naagin)

on:
  schedule:
    # Bangladesh time রাত 12:00 AM = UTC 6:00 PM
    - cron: '0 18 * * *'
  
  # Manual trigger এর জন্য (test করতে চাইলে)
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write   # repo তে commit করার জন্য

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run M3U Update Script
        run: python scripts/update_m3u.py

      - name: Commit & Push Changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add player.m3u
          # কোনো change না থাকলে commit skip করবে
          git diff --cached --quiet || git commit -m "chore: auto-update Naagin M3U domain [$(date '+%Y-%m-%d %H:%M UTC')]"
          git push
